<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Right Now</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ffffff; color: #181818; }
    main { width: min(92vw, 760px); padding: clamp(28px, 6vw, 60px); text-align: center; }
    .eyebrow { margin: 0 0 20px; color: #555555; font-size: .78rem; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
    time { display: block; font-variant-numeric: tabular-nums; font-size: clamp(2rem, 7vw, 4.8rem); font-weight: 760; letter-spacing: -.045em; line-height: 1.05; text-wrap: nowrap; }
    .meta { margin: 18px 0 30px; color: #666666; font-size: .95rem; }
    button { min-width: 180px; border: 0; border-radius: 8px; padding: 14px 22px; background: #7f1d1d; color: #ffffff; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover { background: #641515; }
    button:focus-visible { outline: 3px solid #dc8d8d; outline-offset: 4px; }
    @media (max-width: 480px) { time { font-size: clamp(1.7rem, 8.2vw, 2.3rem); } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Your local time</p>
    <time id="clock" aria-live="off">0000-00-00 00-00-00</time>
    <p class="meta" id="zone"></p>
    <button id="copy" type="button" aria-describedby="clock">Copy current time</button>
  </main>
  <script>
    const clock = document.querySelector('#clock');
    const zone = document.querySelector('#zone');
    const copyButton = document.querySelector('#copy');

    const pad = value => String(value).padStart(2, '0');
    const currentTimestamp = () => {
      const now = new Date();
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
    };

    const tick = () => { clock.textContent = currentTimestamp(); };
    zone.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone.replaceAll('_', ' ');
    tick();
    setInterval(tick, 250);

    copyButton.addEventListener('click', async () => {
      const value = currentTimestamp();
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const input = document.createElement('textarea');
        input.value = value;
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.append(input);
        input.select();
        document.execCommand('copy');
        input.remove();
      }
      copyButton.textContent = `Copied ${value}`;
      window.setTimeout(() => { copyButton.textContent = 'Copy current time'; }, 1600);
    });
  </script>
</body>
</html>
